<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ideBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0B2E" />
      <stop offset="100%" stop-color="#07020E" />
    </radialGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#C77DFF" />
    </linearGradient>
    <filter id="ideGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="248" fill="url(#ideBg)" stroke="#C77DFF" stroke-width="4" stroke-opacity="0.6" />

  <!-- Code Bracket Shapes -->
  <g filter="url(#ideGlow)">
    <!-- Left Bracket < -->
    <path d="M 180 160 L 90 256 L 180 352" fill="none" stroke="url(#codeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Bracket > -->
    <path d="M 332 160 L 422 256 L 332 352" fill="none" stroke="url(#codeGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Slash / -->
    <line x1="285" y1="130" x2="227" y2="382" stroke="#FF548F" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Central Analysis Spark -->
  <circle cx="256" cy="256" r="14" fill="#00F0FF" filter="url(#ideGlow)" />
</svg>
